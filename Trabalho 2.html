<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Processo Digital - Errata</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto p-6 max-w-6xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">Simulador de Processo Digital (Modelo com Errata)</h1>
            <p class="text-gray-400">Simulação baseada na equação corrigida: $C(k) = 0,1535 \cdot m(k-4) + 0,8465 \cdot C(k-1)$</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Painel de Controle -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg md:col-span-1">
                <h2 class="text-xl font-semibold mb-4 text-blue-300 border-b border-gray-700 pb-2">Parâmetros</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Tipo de Entrada:</label>
                    <select id="inputType" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                        <option value="step">Degrau</option>
                        <option value="ramp">Rampa</option>
                        <option value="pulse">Pulso</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Amplitude da Entrada:</label>
                    <input type="number" id="inputAmplitude" value="100" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Número de Passos ($k$):</label>
                    <input type="number" id="numSteps" value="30" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                </div>

                <button onclick="runSimulation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Rodar Simulação
                </button>
            </div>

            <!-- Gráfico -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg md:col-span-2 flex flex-col justify-between">
                <h2 class="text-xl font-semibold mb-4 text-blue-300 border-b border-gray-700 pb-2">Gráfico de Resposta</h2>
                <div class="relative h-64 md:h-80 w-full">
                    <canvas id="simulationChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tabela de Resultados -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg overflow-x-auto">
            <h2 class="text-xl font-semibold mb-4 text-blue-300 border-b border-gray-700 pb-2">Tabela de Simulação Digital</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-blue-200">
                        <th class="p-3 border-b border-gray-600">k</th>
                        <th class="p-3 border-b border-gray-600">t_real (s)</th>
                        <th class="p-3 border-b border-gray-600">m(k) [Entrada]</th>
                        <th class="p-3 border-b border-gray-600">C(k) [Saída]</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody" class="text-gray-300">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let myChart = null;

        function runSimulation() {
            const inputType = document.getElementById('inputType').value;
            const amplitude = parseFloat(document.getElementById('inputAmplitude').value);
            const totalSteps = parseInt(document.getElementById('numSteps').value);
            const T = 20; // Período de amostragem em segundos

            let kValues = [];
            let tRealValues = [];
            let mValues = [];
            let cValues = [];

            // Histórico de entradas m(k) com capacidade para o atraso (n=4 -> m(k-4))
            let mHistory = [0, 0, 0, 0, 0];
            let cCurrent = 0;

            for (let k = 0; k <= totalSteps; k++) {
                // Determinar a entrada atual m(k)
                let mk = 0;
                if (inputType === 'step') {
                    mk = amplitude;
                } else if (inputType === 'ramp') {
                    mk = amplitude * (k / totalSteps);
                } else if (inputType === 'pulse') {
                    if (k >= 2 && k <= 8) mk = amplitude;
                    else mk = 0;
                }

                // Atualizar histórico de m para o atraso de 4 amostras -> m(k-4)
                mHistory.unshift(mk);
                if (mHistory.length > 5) mHistory.pop();
                let m_delayed = mHistory[4]; // m(k-4)

                // Cálculo da saída usando a equação da errata: C(k) = 0.1535 * m(k-4) + 0.8465 * C(k-1)
                if (k > 0) {
                    cCurrent = 0.1535 * m_delayed + 0.8465 * cValues[k - 1];
                } else {
                    cCurrent = 0.1535 * m_delayed + 0.8465 * 0;
                }

                kValues.push(k);
                tRealValues.push(k * T);
                mValues.push(mk);
                cValues.push(parseFloat(cCurrent.toFixed(4)));
            }

            renderChart(kValues, mValues, cValues);
            renderTable(kValues, tRealValues, mValues, cValues);
        }

        function renderChart(labels, mData, cData) {
            const ctx = document.getElementById('simulationChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Entrada m(k)',
                            data: mData,
                            borderColor: 'rgba(239, 68, 68, 1)',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            borderWidth: 2,
                            tension: 0.1,
                            stepped: true
                        },
                        {
                            label: 'Saída C(k)',
                            data: cData,
                            borderColor: 'rgba(59, 130, 246, 1)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            grid: { color: 'rgba(75, 85, 99, 0.2)' },
                            ticks: { color: '#9CA3AF' }
                        },
                        x: {
                            grid: { color: 'rgba(75, 85, 99, 0.2)' },
                            ticks: { color: '#9CA3AF' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#E5E7EB' } }
                    }
                }
            });
        }

        function renderTable(kArr, tArr, mArr, cArr) {
            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = '';

            for (let i = 0; i < kArr.length; i++) {
                const row = document.createElement('tr');
                row.className = i % 2 === 0 ? 'bg-gray-800' : 'bg-gray-750';
                row.innerHTML = `
                    <td class="p-3 border-b border-gray-700">${kArr[i]}</td>
                    <td class="p-3 border-b border-gray-700">${tArr[i]}s</td>
                    <td class="p-3 border-b border-gray-700">${mArr[i]}</td>
                    <td class="p-3 border-b border-gray-700">${cArr[i]}</td>
                `;
                tbody.appendChild(row);
            }
        }

        // Executar simulação inicial ao carregar
        window.onload = runSimulation;
    </script>
</body>
</html>
