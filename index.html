<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            background-image: 
                radial-gradient(circle at center, #1f2937 0%, #030712 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .industrial-panel {
            background: linear-gradient(145deg, #2d3748, #1a202c);
            box-shadow: 
                10px 10px 30px #0b0f19,
                -10px -10px 30px #2d3748,
                inset 2px 2px 5px rgba(255,255,255,0.05),
                inset -2px -2px 5px rgba(0,0,0,0.5);
            position: relative;
        }

        .screw {
            width: 12px;
            height: 12px;
            background: linear-gradient(145deg, #4a5568, #2d3748);
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2), inset -1px -1px 2px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .screw::before {
            content: '';
            width: 8px;
            height: 2px;
            background-color: #1a202c;
            transform: rotate(45deg);
        }

        .screw-tl { top: 12px; left: 12px; }
        .screw-tr { top: 12px; right: 12px; }
        .screw-bl { bottom: 12px; left: 12px; }
        .screw-br { bottom: 12px; right: 12px; }

        .digital-display {
            font-family: 'Share Tech Mono', monospace;
            background-color: #020617;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
            border: 2px solid #334155;
            position: relative;
        }

        .glow-text {
            color: #06b6d4; /* Cyan-400 */
            text-shadow: 
                0 0 5px rgba(6, 182, 212, 0.5),
                0 0 10px rgba(6, 182, 212, 0.3);
        }

        .btn-industrial {
            transition: all 0.1s ease;
            box-shadow: 
                4px 4px 10px rgba(0,0,0,0.5),
                -2px -2px 5px rgba(255,255,255,0.1),
                inset 1px 1px 2px rgba(255,255,255,0.2),
                inset -1px -1px 2px rgba(0,0,0,0.4);
        }

        .btn-industrial:active {
            transform: translateY(4px);
            box-shadow: 
                1px 1px 3px rgba(0,0,0,0.5),
                inset 2px 2px 5px rgba(0,0,0,0.6);
        }

        .led-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981; /* Emerald-500 */
            box-shadow: 0 0 10px #10b981, inset 1px 1px 2px rgba(255,255,255,0.8);
            transition: background-color 0.3s;
        }

        .led-active {
            animation: pulse-led 1s infinite alternate;
        }

        @keyframes pulse-led {
            from { box-shadow: 0 0 5px #10b981, inset 1px 1px 2px rgba(255,255,255,0.8); }
            to { box-shadow: 0 0 20px #10b981, 0 0 10px #34d399, inset 1px 1px 2px rgba(255,255,255,0.8); }
        }
    </style>
</head>
<body>

    <div class="industrial-panel w-11/12 max-w-md p-8 rounded-2xl border border-gray-700 flex flex-col items-center">
        <!-- Parafusos decorativos -->
        <div class="screw screw-tl"></div>
        <div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div>
        <div class="screw screw-br"></div>

        <!-- Cabeçalho do Painel -->
        <div class="w-full flex justify-between items-center mb-6 px-2">
            <div class="flex items-center gap-2">
                <div id="status-led" class="led-indicator led-active"></div>
                <span class="text-xs text-gray-400 font-bold tracking-widest uppercase">PWR OK</span>
            </div>
            <span class="text-sm text-gray-500 font-black tracking-widest">CTRL-X900</span>
        </div>

        <!-- Display Digital -->
        <div class="digital-display w-full h-32 rounded-lg flex items-center justify-center mb-10 overflow-hidden relative">
            <!-- Camada de reflexo sutil -->
            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent pointer-events-none"></div>
            
            <div id="counter-value" class="glow-text text-7xl md:text-8xl select-none tabular-nums font-bold">
                0000
            </div>
        </div>

        <!-- Controles -->
        <div class="w-full grid grid-cols-2 gap-6 relative">
            
            <!-- Botão Decrementar -->
            <button id="btn-decrement" class="btn-industrial bg-gradient-to-b from-gray-600 to-gray-800 text-red-500 font-black text-4xl h-24 rounded-xl flex items-center justify-center border-t border-gray-500 select-none hover:text-red-400 focus:outline-none">
                -
            </button>

            <!-- Botão Incrementar -->
            <button id="btn-increment" class="btn-industrial bg-gradient-to-b from-gray-600 to-gray-800 text-green-500 font-black text-4xl h-24 rounded-xl flex items-center justify-center border-t border-gray-500 select-none hover:text-green-400 focus:outline-none">
                +
            </button>

            <!-- Botão Reset - Ocupa ambas as colunas -->
            <button id="btn-reset" class="btn-industrial col-span-2 bg-gradient-to-b from-yellow-700 to-yellow-900 text-yellow-300 font-bold text-lg h-16 rounded-xl flex items-center justify-center border-t border-yellow-600 select-none tracking-widest hover:text-yellow-200 mt-2 focus:outline-none uppercase">
                Reset System
            </button>
        </div>

        <div class="mt-8 text-xs text-gray-600 font-mono tracking-widest border-t border-gray-700 pt-4 w-full text-center">
            SYS_RDY // AUTOMATION MODULE
        </div>
    </div>

    <script>
        // Estado inicial
        let count = 0;
        
        // Elementos do DOM
        const displayEl = document.getElementById('counter-value');
        const btnIncrement = document.getElementById('btn-increment');
        const btnDecrement = document.getElementById('btn-decrement');
        const btnReset = document.getElementById('btn-reset');
        const statusLed = document.getElementById('status-led');

        // Função para formatar o número com zeros à esquerda (ex: 0005)
        function formatNumber(num) {
            // Lida com números negativos mantendo o alinhamento
            if (num < 0) {
                return '-' + Math.abs(num).toString().padStart(3, '0');
            }
            return num.toString().padStart(4, '0');
        }

        // Função para atualizar o display visual
        function updateDisplay() {
            displayEl.textContent = formatNumber(count);
            
            // Efeito visual de piscar rápido o LED no clique
            statusLed.classList.remove('led-active');
            statusLed.style.backgroundColor = '#34d399'; // Verde mais claro
            setTimeout(() => {
                statusLed.classList.add('led-active');
                statusLed.style.backgroundColor = ''; // Volta ao original
            }, 100);
        }

        // Event Listeners para os botões
        btnIncrement.addEventListener('click', () => {
            // Limite opcional, vamos definir até 9999
            if (count < 9999) {
                count++;
                updateDisplay();
            }
        });

        btnDecrement.addEventListener('click', () => {
            // Limite opcional negativo, vamos permitir até -999
            if (count > -999) {
                count--;
                updateDisplay();
            }
        });

        btnReset.addEventListener('click', () => {
            count = 0;
            updateDisplay();
            
            // Efeito visual amarelo no reset
            statusLed.style.backgroundColor = '#fbbf24'; 
            setTimeout(() => {
                statusLed.style.backgroundColor = ''; 
            }, 300);
        });

        // Suporte a teclado
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp' || event.key === '+') {
                btnIncrement.click();
                btnIncrement.classList.add('active-state-simulate'); // Feedback visual extra opcional
            } else if (event.key === 'ArrowDown' || event.key === '-') {
                btnDecrement.click();
            } else if (event.key === 'Escape' || event.key === 'r') {
                btnReset.click();
            }
        });

        // Inicializa o display no primeiro carregamento
        updateDisplay();
    </script>
</body>
</html>
